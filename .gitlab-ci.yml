stages:
  - init
  - build
  - docker
  - release

workflow:
  rules:
    # Run pipeline for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run pipeline for pushes to default branch — on the ref-protected Mac runner (see MAC_DOCKER)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables: { MAC_DOCKER: macos-protected }
    # Run pipeline for pushes to branches without open merge requests
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Run pipeline for all other branch pushes
    - if: '$CI_COMMIT_BRANCH'
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # The Mac Docker runner by trust (docs on the Mac Mini: ~/Documents/Claude/GitLab/BuildKit.md):
  # `main` pipelines run on the ref-protected "Kirbo Mini Protected" (its own cache, protected-branch
  # jobs only — the workflow rule above), every other pipeline on the shared "Kirbo Mini". Jobs name
  # `$MAC_DOCKER`, never the tag itself.
  MAC_DOCKER: "macos"
  DOCKER_BUILDER_NAME: "builder-${CI_JOB_ID}"
  DOCKERHUB_REPOSITORY: "kirbownz/${BINARY_NAME}"
  IMAGE_NAME: ${DOCKERHUB_REPOSITORY}
  BINARY_NAME: combine-changelogs
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  GIT_STRATEGY: clone

# Default configuration for all jobs
default:
  tags:
    - $MAC_DOCKER

bump version:
  stage: init
  image:
    # go-semantic-release, pinned by digest (it runs with the release token); bump via /maintain.
    name: registry.gitlab.com/go-semantic-release/semantic-release@sha256:43f2fd02c91254791bff745f23afc2953c43b0a107fa17b338e7ca81762e1c21
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_COMMIT_TAG == null'
  cache: []
  artifacts:
    paths:
      - .version-unreleased
      - build.env
      - CHANGELOG.md
    expire_in: never
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git remote set-url origin "$CI_REPOSITORY_URL" || echo 'Not a git repository; skipping'
    - git fetch --tags --force || true
    - git fetch origin "$CI_DEFAULT_BRANCH" || true
  script:
    - semantic-release --version-file --changelog CHANGELOG.md --dry
    - export VERSION=$(cat .version-unreleased)
    - echo "VERSION=${VERSION}" > build.env
    - echo "sonar.projectVersion=${VERSION}" >> sonar-project.properties
    - cat CHANGELOG.md

# Reusable build template — cross-compiles for Linux.
# Set GOARCH in the extending job.
.build:
  stage: build
  image: golang:alpine
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-${GOARCH}
    # Only needs to survive long enough for the upload job to pick it up.
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG == null'
  script:
    - GOOS=linux go build -o ${BINARY_NAME}-linux-${GOARCH} .

build:amd64:
  extends: .build
  variables:
    GOARCH: amd64

build:arm64:
  extends: .build
  variables:
    GOARCH: arm64

# Builds multi-platform Docker images (amd64 + arm64) and pushes them to Docker Hub.
# Uses the binaries from the build jobs (docker/Dockerfile COPYs combine-changelogs-linux-$TARGETARCH).
#
# Requires DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD CI/CD variables (DOCKERHUB_PASSWORD is protected,
# so the job runs on protected branches only — a branch pipeline could never push).
#
# No Docker socket: `docker buildx` talks to the Mac's protected BuildKit server over mutual TLS
# (`--driver remote`; client certificate in the protected File variables BUILDKIT_PROTECTED_*).
# `docker login` needs no daemon — it writes the job's ~/.docker/config.json, which buildx hands on.
build-and-push-docker:
  stage: docker
  # docker:29.9.2-cli (buildx 0.38.1), pinned by digest.
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  needs:
    - job: bump version
      artifacts: true
    - job: build:amd64
      artifacts: true
    - job: build:arm64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
  before_script:
    - export BUILDER_NAME="${DOCKER_BUILDER_NAME}"
    - docker buildx create --name "${BUILDER_NAME}" --driver remote --driver-opt "cacert=${BUILDKIT_PROTECTED_CA},cert=${BUILDKIT_PROTECTED_CERT},key=${BUILDKIT_PROTECTED_KEY}" tcp://host.docker.internal:12340
    - docker buildx inspect --bootstrap "${BUILDER_NAME}"
    - echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin "${DOCKERHUB_REGISTRY}"
  script:
    - source build.env
    - |
      docker buildx build \
        --builder "${BUILDER_NAME}" \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION=${VERSION} \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA} \
        --provenance=true \
        --sbom=true \
        -t ${DOCKERHUB_REGISTRY}/${DOCKERHUB_REPOSITORY}:latest \
        -t ${DOCKERHUB_REGISTRY}/${DOCKERHUB_REPOSITORY}:${VERSION} \
        --push \
        -f docker/Dockerfile .
  after_script:
    - docker buildx rm "${DOCKER_BUILDER_NAME}" || true
    - docker logout "${DOCKERHUB_REGISTRY}" || true


# Runs on every push to the default branch.
# Analyzes conventional commits, determines the next semantic version,
# generates a changelog, and creates a GitLab release + tag.
#
# Requires a GITLAB_TOKEN CI/CD variable (Settings → CI/CD → Variables)
# with `api` scope — CI_JOB_TOKEN does not have permission to push tags.
semantic-release:
  stage: release
  image:
    # go-semantic-release, pinned by digest (it runs with the release token); bump via /maintain.
    name: registry.gitlab.com/go-semantic-release/semantic-release@sha256:43f2fd02c91254791bff745f23afc2953c43b0a107fa17b338e7ca81762e1c21
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG == null'
  script:
    - semantic-release --provider gitlab --provider-opt "gitlab_baseurl=${CI_SERVER_URL}"


# Uploads the compiled binaries to the Generic Packages Registry and attaches
# them as downloadable assets to the release that go-semantic-release created.
upload-binaries:
  stage: release
  image: alpine:3.23@sha256:f3d55900449227ae9e237ede521e7b665d53a253b42065ba90b9db9275e198ad
  needs:
    - job: semantic-release
    - job: bump version
      artifacts: true
    - job: build:amd64
      artifacts: true
    - job: build:arm64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG == null'
  before_script:
    - apk add --no-cache curl
    - source build.env
  script:
    - |
      for GOARCH in amd64 arm64; do
        DOWNLOAD_URL="${CI_PROJECT_URL}/-/packages/generic/${BINARY_NAME}/${VERSION}/${BINARY_NAME}-linux-${GOARCH}"

        # Upload binary to the Generic Packages Registry
        curl --fail --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${BINARY_NAME}-linux-${GOARCH}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BINARY_NAME}/${VERSION}/${BINARY_NAME}-linux-${GOARCH}"

        # Attach the uploaded file as an asset link on the existing release
        curl --fail --show-error \
          --request POST \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{\"name\":\"${BINARY_NAME}-linux-${GOARCH}\",\"url\":\"${DOWNLOAD_URL}\",\"link_type\":\"package\"}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/v${VERSION}/assets/links"
      done
