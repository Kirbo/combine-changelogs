stages:
  - init
  - test
  - build
  - docker
  - release

workflow:
  # A new push cancels the interruptible jobs (checks, builds) of the previous pipeline on the same
  # ref; the publishing jobs are not interruptible.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Run pipeline for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Run pipeline for pushes to a protected branch (`main`) — on the ref-protected Mac runner (see MAC_DOCKER)
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      variables: { MAC_DOCKER: macos-protected }
    # Run pipeline for pushes to branches without open merge requests
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Run pipeline for all other branch pushes
    - if: '$CI_COMMIT_BRANCH'
    # Run pipeline for web/api triggers
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  # The Mac Docker runner by trust (docs on the Mac Mini: ~/Documents/Claude/GitLab/BuildKit.md):
  # protected-branch pipelines run on the ref-protected "Kirbo Mini Protected" (its own cache,
  # protected-branch jobs only — the workflow rule above), every other pipeline on the shared
  # "Kirbo Mini". Jobs name `$MAC_DOCKER`, never the tag itself.
  MAC_DOCKER: "macos"
  BINARY_NAME: combine-changelogs
  DOCKER_BUILDER_NAME: "builder-${CI_JOB_ID}"
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_REPOSITORY: "kirbownz/${BINARY_NAME}"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BINARY_NAME}"
  GIT_DEPTH: "0"  # git-cliff needs the full history and the tags
  GIT_STRATEGY: clone
  CGO_ENABLED: "0"
  # The toolchain comes from mise.toml, installed in LOCKED mode: only the exact, checksummed
  # artifacts mise.lock names (no GitHub API calls). Tools and the Go build cache stay inside the
  # project dir so they can be cached.
  MISE_LOCKED: "1"
  MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  # Trust mise.toml without an interactive prompt (idempotent, unlike `mise trust`)
  MISE_TRUSTED_CONFIG_PATHS: "$CI_PROJECT_DIR"

# Default for all jobs: the mise image (mise 2026.10.19, Debian), pinned by digest; each job
# installs the tools it names in MISE_TOOLS from mise.lock. Bump via /maintain.
default:
  image:
    name: ghcr.io/jdx/mise:2026.10.19-debian@sha256:9b8995abd457c975a4f5150b423f6569ee5a01960662ffa4c06c859867e59a21
    entrypoint: [""]
  tags:
    - $MAC_DOCKER
  interruptible: true
  before_script:
    - mise install --locked ${MISE_TOOLS}
    - eval "$(mise env -s bash)"
  # One cache per stage (each stage installs its own tools) and mise.lock. GitLab keeps protected
  # and unprotected refs' caches apart, and the protected runner has its own cache folder, so a
  # branch job can never feed what a release build restores.
  cache:
    key:
      prefix: $CI_JOB_STAGE
      files:
        - mise.lock
    paths:
      - .mise
      - .go/cache

# Works out the next SemVer version from the Conventional Commits since the last tag, and that
# release's notes (git-cliff: cliff.toml, scripts/next-version.sh). Writes VERSION and RELEASE to
# build.env (dotenv: downstream jobs get them as variables) and the notes to CHANGELOG.md for the
# release job. Nothing releasable since the last release (only `ci:`, `docs:`, `chore:` …) is not a
# failure: RELEASE=false, VERSION empty — the builds still run as a check, but the docker and
# release jobs publish nothing. `just next-version` previews the same locally. The version is only
# ever stamped into the build (ldflags, image tags, release) — CI never commits it back.
bump version:
  stage: init
  variables:
    MISE_TOOLS: git-cliff jq
  rules:
    - if: '$CI_COMMIT_TAG == null'
  artifacts:
    paths:
      - build.env
      - CHANGELOG.md
    reports:
      dotenv: build.env
    expire_in: never
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --tags --force
    # Any failure (e.g. git-cliff failing) fails the job instead of silently skipping the release.
    - VERSION="$(scripts/next-version.sh --notes CHANGELOG.md)"
    - |
      if [ -n "$VERSION" ]; then
        printf 'VERSION=%s\nRELEASE=true\n' "$VERSION" > build.env
        echo "Next release: v${VERSION}"
        cat CHANGELOG.md
      else
        printf 'VERSION=\nRELEASE=false\n' > build.env
        : > CHANGELOG.md
        echo "no releasable commits since the last release — building as a check, publishing nothing"
      fi

# gofmt, go vet, the tests (total coverage on the job) and shellcheck — `just check` locally.
check:
  stage: test
  needs: []
  variables:
    MISE_TOOLS: go just shellcheck
  rules:
    - if: '$CI_COMMIT_TAG == null'
  script:
    - just check
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# mise.lock must name every pin in mise.toml for every platform: CI installs from it in locked mode,
# so a stale lock would stop the pipeline. `--dry-run` installs nothing. Fix: `mise lock`, commit.
mise.lock in sync:
  stage: test
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG == null'
  before_script: []
  cache: []
  script:
    - mise install --locked --dry-run

# Cross-compiles for Linux (GOARCH from the extending job), stamping the version from `bump version`
# into the binary (`-version` prints it; "dev" when nothing is released).
.build:
  stage: build
  needs:
    - job: bump version
      artifacts: true
  variables:
    MISE_TOOLS: go
  artifacts:
    paths:
      - ${BINARY_NAME}-linux-${GOARCH}
    # Only needs to survive long enough for the docker and release jobs to pick it up.
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG == null'
  script:
    - GOOS=linux go build -trimpath -ldflags "-X main.version=${VERSION:-dev}" -o "${BINARY_NAME}-linux-${GOARCH}" .
    - '[ "$GOARCH" != "$(go env GOHOSTARCH)" ] || "./${BINARY_NAME}-linux-${GOARCH}" -version'

build:amd64:
  extends: .build
  variables:
    GOARCH: amd64

build:arm64:
  extends: .build
  variables:
    GOARCH: arm64

# Builds multi-platform Docker images (amd64 + arm64) and pushes them to Docker Hub as `:latest`
# and `:<version>`. Uses the binaries from the build jobs (docker/Dockerfile COPYs
# combine-changelogs-linux-$TARGETARCH). Writes the pushed image's digest to image.env for the
# release job, so consumers can pin `kirbownz/combine-changelogs:<version>@sha256:…`.
#
# Docker Hub credentials: environment release/publish gives the job its fnox tier identity
# (FNOX_AGE_KEY_FILE, protected); ci/secrets.sh `dockerhub_login` decrypts the publish profile —
# or, until fnox is set up, falls back to the legacy GitLab variables DOCKERHUB_USERNAME /
# DOCKERHUB_PASSWORD (protected). docs/SECRETS.md. Protected refs only — a branch pipeline could
# never push.
#
# No Docker socket: `docker buildx` talks to the Mac's protected BuildKit server over mutual TLS
# (`--driver remote`; client certificate in the protected File variables BUILDKIT_PROTECTED_*).
# `docker login` needs no daemon — it writes the job's ~/.docker/config.json, which buildx hands on.
build-and-push-docker:
  stage: docker
  # docker:29.9.2-cli (buildx 0.38.1), pinned by digest (it holds the push credentials).
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  interruptible: false
  resource_group: publish
  cache: []
  environment:
    name: release/publish
    action: prepare
  needs:
    - job: bump version
      artifacts: true
    - job: build:amd64
      artifacts: true
    - job: build:arm64
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
  artifacts:
    paths:
      - image.env
    reports:
      dotenv: image.env
    expire_in: never
  before_script:
    - '[ "${RELEASE}" = true ] || { echo "no release — no image to publish"; echo "IMAGE_DIGEST=" > image.env; exit 0; }'
    - export BUILDER_NAME="${DOCKER_BUILDER_NAME}"
    - docker buildx create --name "${BUILDER_NAME}" --driver remote --driver-opt "cacert=${BUILDKIT_PROTECTED_CA},cert=${BUILDKIT_PROTECTED_CERT},key=${BUILDKIT_PROTECTED_KEY}" tcp://host.docker.internal:12340
    - docker buildx inspect --bootstrap "${BUILDER_NAME}"
    - . ci/secrets.sh
    - dockerhub_login
  script:
    - IMAGE="${DOCKERHUB_REGISTRY}/${DOCKERHUB_REPOSITORY}"
    - |
      docker buildx build \
        --builder "${BUILDER_NAME}" \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION=${VERSION} \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA} \
        --provenance=true \
        --sbom=true \
        -t ${IMAGE}:latest \
        -t ${IMAGE}:${VERSION} \
        --push \
        -f docker/Dockerfile .
    - IMAGE_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
    - echo "${IMAGE_DIGEST}" | grep -Eqx 'sha256:[0-9a-f]{64}'
    - echo "IMAGE_DIGEST=${IMAGE_DIGEST}" > image.env
    - echo "Pushed ${IMAGE}:${VERSION} and :latest — pin it as ${DOCKERHUB_REPOSITORY}:${VERSION}@${IMAGE_DIGEST}"
  after_script:
    - docker buildx rm "${DOCKER_BUILDER_NAME}" || true
    - docker logout "${DOCKERHUB_REGISTRY}" || true

# Uploads the binaries to the Generic Packages Registry, then creates the tag and the GitLab
# release with the notes from `bump version`, the binaries and the pinned Docker image as asset
# links. glab authenticates with CI_JOB_TOKEN (CI auto-login) — no other token: the Releases API
# creates the tag from CI_COMMIT_SHA. The `release:` keyword isn't used because it cannot be
# skipped when nothing is releasable.
release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
    entrypoint: [""]
  interruptible: false
  # Serialize with other pipelines' releases, so two quick pushes can't publish one version twice.
  resource_group: release
  before_script: []
  cache: []
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: bump version
      artifacts: true
    - job: build:amd64
      artifacts: true
    - job: build:arm64
      artifacts: true
    - job: build-and-push-docker
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
  script:
    - |
      if [ "${RELEASE}" != true ]; then
        echo "no releasable commits — no release"
        exit 0
      fi
      apk add --no-cache curl >/dev/null

      LINKS=""
      for GOARCH in amd64 arm64; do
        NAME="${BINARY_NAME}-linux-${GOARCH}"
        echo "Uploading ${NAME}..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${NAME}" \
          "${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}" >/dev/null
        LINKS="${LINKS:+${LINKS},}{\"name\":\"${NAME}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${VERSION}/${NAME}\",\"link_type\":\"package\"}"
      done
      IMAGE_REF="${DOCKERHUB_REPOSITORY}:${VERSION}@${IMAGE_DIGEST}"
      LINKS="${LINKS},{\"name\":\"Docker image ${IMAGE_REF}\",\"url\":\"https://hub.docker.com/r/${DOCKERHUB_REPOSITORY}/tags?name=${VERSION}\",\"link_type\":\"image\"}"

      glab release create "v${VERSION}" \
        --repo "${CI_PROJECT_PATH}" \
        --name "v${VERSION}" \
        --ref "${CI_COMMIT_SHA}" \
        --notes-file CHANGELOG.md \
        --assets-links "[${LINKS}]"
      echo "Released v${VERSION}; image ${IMAGE_REF}"
