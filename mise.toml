# Developer + CI toolchain — install everything with `mise install`.
# Versions are pinned EXACTLY (never `latest`) and recorded with their download URL and sha256 for
# every platform below in the committed mise.lock, so local builds, CI and the release binaries use
# the same toolchain. CI installs in locked mode (MISE_LOCKED=1, `mise install --locked`): a tool,
# version or artifact the lock does not name fails the job. After changing a pin: `mise lock`, commit
# mise.lock (the `mise.lock in sync` CI job fails otherwise). /maintain bumps them.
[tools]
# Build. go.mod's `go` line is the minimum language version for people building from source; this
# pin is the exact toolchain CI and the releases build with.
go = "1.27.3"
# Task runner (Justfile)
just = "1.59.0"
# Lint for the shell scripts (scripts/, ci/, install.sh)
shellcheck = "0.11.0"

# Release notes and the next SemVer version (cliff.toml, scripts/next-version.sh)
git-cliff = "2.14.2"
jq = "1.8.2"

# Secrets (fnox.toml, scripts/secrets.sh, ci/secrets.sh — docs/SECRETS.md). age ships the
# age-plugin-pq through which fnox reaches the post-quantum keys.
fnox = "1.47.0"
age = "1.3.2"

[settings]
# mise.lock (committed) records each tool's version, URL and sha256 for these platforms: the Mac
# runners' Linux containers (arm64), x86_64 Linux, and maintainer Macs — plus the musl (Alpine)
# variants, which the Docker job's docker:cli image needs for fnox (ci/install-locked.sh installs
# from those entries there; the glibc builds do not run on Alpine). `mise install` / `mise lock`
# keep it current.
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "linux-arm64-musl", "linux-x64-musl"]
# Release-age quarantine: a version mise RESOLVES (`mise upgrade --bump`, `mise latest`) skips
# anything published in the last day. Exact pins are not filtered — /maintain checks their age.
minimum_release_age = "1d"

[env]
# Version of golang.org/x/vuln used by the `just vuln` recipe
GOVULNCHECK_VERSION = "v1.9.0"
